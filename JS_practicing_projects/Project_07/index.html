<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Password Generator</h1>
        <div class="pas-inp">
            <input type="text" disabled id="pswdInp">
            <input type="range" min="3" max="20" value="8" id="inpSlider">
            <div class="row">
                <p>Password length</p>
                <span id="sliderVal"></span>
            </div>
        </div>
        <div class="row">
            <label for="lowercase">Lowercase Letters (a-z)</label>
            <input type="checkbox" name="lowercase" class="lowercase">
        </div>
        <div class="row">
            <label for="uppercase">Uppercase Letters (A-Z)</label>
            <input type="checkbox" name="uppercase" class="uppercase">
        </div>
        <div class="row">
            <label for="Numbers">Numbers (0-9)</label>
            <input type="checkbox" name="Numbers" class="Numbers">
        </div>
        <div class="row">
            <label for="symbol">Symbol (@-+)</label>
            <input type="checkbox" name="symbol" class="symbol">
        </div>
        <button id="genBtn">Generate Password</button>
    </div>
</body>
<script src="scipt.js"></script>

</html>
